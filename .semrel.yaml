# yaml-language-server: $schema=https://registry.semrel.io/schemas/core/v1.json
#
# semrel uses itself to manage its own releases — dogfooding.
# version_ceiling keeps us in 0.x.x until we deliberately promote to 1.0.0.
# To release 1.0.0: remove or raise version_ceiling and commit.
#
# Plugins are sourced from their respective repos until they have official releases.
# The semrel-release workflow builds them from source before running semrel.
#
# provider-github is intentionally NOT listed here as a `phase: provider` plugin:
# it needs the built release archives/checksums to already exist as
# SEMREL_PLUGIN_ASSETS, but those can only be built *after* semrel has
# determined the version/tag. The semrel-release workflow instead builds the
# release assets after `semrel release` runs, then invokes the
# provider-github plugin binary directly (same env-var contract, just called
# standalone) to create the GitHub release and upload the assets.


schemaVersion: 1
branches:
    - name: main
tagPrefix: v
rules:
    - type: feat
      bump: minor
    - type: fix
      bump: patch
    - type: perf
      bump: patch
    - type: revert
      bump: patch
plugins:
    - uses: "@semrel/condition-github-actions"
      phase: condition
version_ceiling: 1.0.0
ceiling_strategy: clamp
commit_changelog: false
tag_exists_strategy: update-changelog
