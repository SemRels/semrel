# This code has been partially generated by an AI.
# yaml-language-server: $schema=https://registry.semrel.io/schemas/core/v1.json
#
# semrel uses itself to manage its own releases — dogfooding.
# version_ceiling keeps us in 0.x.x until we deliberately promote to 1.0.0.
# To release 1.0.0: remove or raise version_ceiling and commit.
#
# Released plugins are pinned in .semrel.lock and restored by Semrel.
#
# provider-github is intentionally NOT listed here as a `phase: provider` plugin:
# it needs the built release archives/checksums to already exist as
# SEMREL_PLUGIN_ASSETS, but those can only be built *after* semrel has
# determined the version/tag. The semrel-release workflow instead builds the
# release assets after `semrel release` runs, then invokes provider-github
# directly to create the GitHub release and upload the assets. The PR-comment
# feature is not yet available from a published registry plugin version.
# The workflow commits the generated changelog on its PR branch after semrel
# creates the tag, keeping the tag reachable from protected main.

schemaVersion: 1
branches:
    - name: main
tagPrefix: v
commit_changelog: false
rules:
    - type: feat
      bump: minor
    - type: fix
      bump: patch
    - type: perf
      bump: patch
    - type: revert
      bump: patch
plugins:
    - uses: "@semrel/condition-github-actions"
      phase: condition
    # The wrapper maps core contributor metadata into the notes plugin's input.
    - path: .github/scripts/release-notes-generator.sh
      phase: generator
      args:
          ai-disclosure: "true"
          ai-disclosure-section: "true"
          mvp: "true"
          signature: "true"
version_ceiling: 1.0.0
ceiling_strategy: clamp
tag_exists_strategy: update-changelog
