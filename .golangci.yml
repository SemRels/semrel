version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/SemRels/semrel

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - revive
    - gosec
  settings:
    revive:
      rules:
        - name: exported
          severity: warning
    errcheck:
      exclude-functions:
        - fmt.Print
        - fmt.Println
        - fmt.Printf
        - fmt.Fprintln
        - fmt.Fprintf
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck  # test code does not need to handle every error
          - unused    # test helpers may be defined for planned tests
      # G204: subprocess launched with variable — intentional (semrel invokes git)
      - linters: [gosec]
        text: "G204"
      # G304: file inclusion via variable — intentional (semrel reads user config/changelogs)
      - linters: [gosec]
        text: "G304"
      # G301/G302/G306: file permissions 0644/0755 — acceptable for CLI output files
      - linters: [gosec]
        text: "G(301|302|306)"
      # G703: path traversal via taint analysis — intentional (WriteFile to user-provided paths)
      - linters: [gosec]
        text: "G703"
      # revive: exported type stutter (e.g. RegistryClient) — renaming would be a breaking change
      - linters: [revive]
        text: "stutters"
      # staticcheck S1016: use type conversion instead of struct literal — style preference
      - linters: [staticcheck]
        text: "S1016"
      # staticcheck QF1012: use fmt.Fprintf instead of WriteString(fmt.Sprintf) — style preference
      - linters: [staticcheck]
        text: "QF1012"
