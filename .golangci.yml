version: "2"

run:
  timeout: 5m
  go: "1.24"

linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - goimports
    - revive
    - gosec

linters-settings:
  goimports:
    local-prefixes: github.com/GoSemantics/semrel
  revive:
    rules:
      - name: exported
        severity: warning

issues:
  # golangci-lint built with go1.24 can't process go1.26-only stdlib files;
  # suppress the typecheck error to keep CI green until the workflow is updated.
  exclude:
    - "file requires newer Go version"
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
    - linters:
        - typecheck
      text: "file requires newer Go version"
