version: 2

builds:
  - id: semrel
    main: ./cmd/semrel
    binary: semrel
    ldflags:
      - -trimpath
      - -X github.com/SemRels/semrel/internal/version.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: semrel
    builds: [semrel]
    name_template: "semrel-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: "semrel-{{ .Version }}-checksums.txt"

changelog:
  disable: true
