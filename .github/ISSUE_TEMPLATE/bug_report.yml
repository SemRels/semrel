name: Bug Report
description: Report a bug in go-semrel
labels: ["type: bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! For **security vulnerabilities** please use [GitHub Security Advisories](https://github.com/GoSemantics/go-semrel/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: go-semrel version
      placeholder: "e.g. v0.1.0 or `go-semrel --version`"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Config file content
        2. Command run
        3. Output / error
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Go version, git version"
