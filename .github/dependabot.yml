version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "type: chore"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "type: chore"
    commit-message:
      prefix: "chore(ci)"
    groups:
      # init/analyze/upload-sarif must stay on the same version or CodeQL
      # fails with "Loaded a configuration file for version X, but running
      # version Y" — bumping them one PR at a time broke CI repeatedly.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
