# Release — build and publish binaries on version tags using GoReleaser
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" == *$'\r'* || "${RELEASE_TAG}" == *$'\n'* ]]; then
            printf 'Release tag must not contain CR or LF characters.\n' >&2
            exit 1
          fi
          semver_re='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "${RELEASE_TAG}" =~ ${semver_re} ]] || {
            printf 'Release tag is not strict SemVer: %s\n' "${RELEASE_TAG}" >&2
            exit 1
          }
          normalized="${RELEASE_TAG#v}"
          without_build="${normalized%%+*}"
          if [[ "${without_build}" == *-* ]]; then
            IFS='.' read -r -a identifiers <<< "${without_build#*-}"
            for identifier in "${identifiers[@]}"; do
              [[ ! "${identifier}" =~ ^0[0-9]+$ ]] || {
                printf 'Numeric prerelease identifiers must not contain leading zeros.\n' >&2
                exit 1
              }
            done
          fi
          {
            printf 'canonical_tag=v%s\n' "${normalized}"
            printf 'normalized=%s\n' "${normalized}"
          } >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.sum is up to date
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod or go.sum is out of date — run 'go mod tidy' and commit the result."
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch exact Docker publication
        shell: bash
        env:
          CANONICAL_TAG: ${{ steps.version.outputs.canonical_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NORMALIZED_VERSION: ${{ steps.version.outputs.normalized }}
        run: |
          set -euo pipefail
          [[ "${CANONICAL_TAG}" == "v${NORMALIZED_VERSION}" ]]
          # workflow_dispatch is intentionally emitted by GITHUB_TOKEN. A release
          # event may also run Docker; exact publication is serialized and idempotent.
          gh workflow run docker.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${CANONICAL_TAG}" \
            --field "version=${NORMALIZED_VERSION}"
