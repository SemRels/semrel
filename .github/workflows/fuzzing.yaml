name: Fuzzing
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"
permissions: read-all
jobs:
  fuzz:
    name: Go fuzzing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run fuzz tests (short)
        run: |
          go test ./pkg/semver/... -fuzz=FuzzParseVersion -fuzztime=30s
          go test ./pkg/commits/... -fuzz=FuzzParseMessage -fuzztime=30s || true
