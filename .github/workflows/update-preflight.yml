name: Update preflight

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  plugin-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check CLI and plugin updates
        run: go run ./cmd/semrel doctor --online --output json > update-preflight.json || true
      - name: Update pinned plugins
        run: go run ./cmd/semrel plugin update
      - name: Create update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- .semrel.lock; then
            echo "No plugin updates available."
            exit 0
          fi
          branch="automation/plugin-updates"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .semrel.lock
          git commit -m "chore(deps): update semrel plugins"
          git push --force-with-lease origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "chore(deps): update semrel plugins" \
            --body "Automated update from the weekly semrel update preflight."
