# DCO — require Signed-off-by on all commits
name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: DCO Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: tim-actions/dco@7c4b0e76db6d3c26949c0a0bbe9a1cc71e1ab8e7 # v1.1.4
