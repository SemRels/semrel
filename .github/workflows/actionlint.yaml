# actionlint — validate GitHub Actions workflow syntax on every PR
name: actionlint

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'

permissions: read-all

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run actionlint
        uses: reviewdog/action-actionlint@e0207a28405ecad11953ba625a95d92f7889572a # v1
