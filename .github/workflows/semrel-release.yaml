#
# semrel-release — uses semrel to version semrel itself (dogfooding).
# Flow: push to main → semrel creates tag → GoReleaser publishes release → Docker build+push
#
# NOTE: All steps are inlined in one workflow because GITHUB_TOKEN-triggered events
# (tag pushes, release creation) cannot trigger other workflows (GitHub Actions security
# restriction). Docker build is a separate job that depends on the release job.
name: Semrel Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write      # push tags and create releases
  packages: write      # push Docker images to ghcr.io
  id-token: write      # cosign OIDC signing
  attestations: write  # SBOM / provenance attestation

jobs:
  release:
    name: Run semrel + GoReleaser
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semrel.outputs.released }}
      tag: ${{ steps.semrel.outputs.tag }}
      version_short: ${{ steps.semrel.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build semrel from source
        run: go build -ldflags="-s -w" -o ./semrel-bin ./cmd/semrel

      - name: Install plugins from source
        # Plugins have no official releases yet — build them from their main branch.
        # Once plugins publish tagged releases this step can switch to:
        #   semrel plugin install condition-github-actions
        # Binaries are placed in ~/.semrel/plugins/ using the discovery name
        # that semrel expects: semrel-plugin-<uses>.
        run: |
          PLUGIN_DIR="$HOME/.semrel/plugins"
          mkdir -p "$PLUGIN_DIR"
          go install github.com/SemRels/condition-github-actions/cmd/plugin@main
          mv "$(go env GOPATH)/bin/plugin" "$PLUGIN_DIR/semrel-plugin-condition-github-actions"
          echo "Installed plugins:"
          ls -la "$PLUGIN_DIR"

      - name: Configure git identity
        run: |
          git config user.name  "semrel-bot"
          git config user.email "semrel-bot@users.noreply.github.com"

      - name: Run semrel release
        id: semrel
        run: ./semrel-bin release --github-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push changelog commit and tag to GitHub
        if: steps.semrel.outputs.released == 'true'
        run: |
          TAG="${{ steps.semrel.outputs.tag }}"
          # Push the CHANGELOG commit first so the tag is reachable from main.
          # semrel commits CHANGELOG.md before tagging (commit_changelog: true),
          # so HEAD may be ahead of origin/main by one commit.
          git push origin HEAD:main
          # Now push the tag — skip if it already exists (idempotent re-runs)
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on remote — skipping tag push (idempotent)."
          else
            git push origin "refs/tags/$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up build artifacts before GoReleaser
        if: steps.semrel.outputs.released == 'true'
        run: |
          rm -f semrel-bin
          git checkout -- CHANGELOG.md 2>/dev/null || true

      - name: Run GoReleaser
        if: steps.semrel.outputs.released == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          if [ "${{ steps.semrel.outputs.released }}" = "true" ]; then
            echo "### Released ${{ steps.semrel.outputs.tag }} 🚀" >> $GITHUB_STEP_SUMMARY
            echo "**Bump:** ${{ steps.semrel.outputs.bump }}" >> $GITHUB_STEP_SUMMARY
            echo "**Previous:** ${{ steps.semrel.outputs.previous_version }}" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.semrel.outputs.ceiling_applied }}" = "true" ]; then
              echo "> ⚠️ version ceiling applied — bump was clamped" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### No release — no releasable commits found." >> $GITHUB_STEP_SUMMARY
          fi

  docker:
    name: Build and push Docker image
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set version metadata
        id: version
        run: |
          echo "version=${{ needs.release.outputs.tag }}" >> $GITHUB_OUTPUT
          echo "version_short=${{ needs.release.outputs.version_short }}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "vcs_ref=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (distroless)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/semrels/semrel
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest

      - name: Build and push distroless image
        id: build-distroless
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            VCS_REF=${{ steps.version.outputs.vcs_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Sign distroless image with cosign
        run: cosign sign --yes ghcr.io/semrels/semrel@${{ steps.build-distroless.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Build and push alpine image
        id: build-alpine
        uses: docker/build-push-action@v6
        with:
          context: .
          target: alpine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/semrels/semrel:${{ steps.version.outputs.version_short }}-alpine
            ghcr.io/semrels/semrel:latest-alpine
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            VCS_REF=${{ steps.version.outputs.vcs_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Sign alpine image with cosign
        run: cosign sign --yes ghcr.io/semrels/semrel@${{ steps.build-alpine.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/semrels/semrel:${{ steps.version.outputs.version_short }}-alpine
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Docker summary
        run: |
          echo "### Docker image published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/semrels/semrel:${{ steps.version.outputs.version_short }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Variants:** distroless, alpine" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
