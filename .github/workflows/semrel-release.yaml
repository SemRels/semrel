# SPDX-FileCopyrightText: 2026 The semrel Authors
#
# semrel-release — uses semrel to version semrel itself (dogfooding).
# Flow: push to main → semrel creates tag → build release binaries + checksums,
#       sign with cosign → publish GitHub release via semrel's own
#       provider-github plugin → Docker build+push
#
# NOTE: All steps are inlined in one workflow because GITHUB_TOKEN-triggered events
# (tag pushes, release creation) cannot trigger other workflows (GitHub Actions security
# restriction). Docker build is a separate job that depends on the release job.
name: Semrel Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialise releases so concurrent pushes do not create conflicting CHANGELOG commits.
# cancel-in-progress: false means later runs queue instead of being cancelled.
concurrency:
  group: semrel-release
  cancel-in-progress: false

permissions: read-all

jobs:
  release:
    name: Run semrel release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.semrel.outputs.released }}
      tag: ${{ steps.semrel.outputs.tag }}
      version_short: ${{ steps.semrel.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build semrel from source
        run: go build -ldflags="-s -w" -o ./semrel-bin ./cmd/semrel

      - name: Install plugins from source
        # Plugins have no official releases yet — build them from their main branch.
        # Once plugins publish tagged releases this step can switch to:
        #   semrel plugin install condition-github-actions
        # Binaries are placed in ~/.semrel/plugins/ using the discovery name
        # that semrel expects: semrel-plugin-<uses>.
        run: |
          PLUGIN_DIR="$HOME/.semrel/plugins"
          mkdir -p "$PLUGIN_DIR"
          go install github.com/SemRels/condition-github-actions/cmd/plugin@main
          mv "$(go env GOPATH)/bin/plugin" "$PLUGIN_DIR/semrel-plugin-condition-github-actions"
          go install github.com/SemRels/updater-go/cmd/plugin@main
          mv "$(go env GOPATH)/bin/plugin" "$PLUGIN_DIR/semrel-plugin-gobinary"
          echo "Installed plugins:"
          ls -la "$PLUGIN_DIR"

      - name: Build provider-github plugin binary
        # Built separately (not into ~/.semrel/plugins) because it is invoked
        # directly as a standalone subprocess below, after release assets
        # exist — not orchestrated through `semrel release` itself (see the
        # "Publish GitHub release" step for why).
        #
        # GOPROXY=direct is required here: the default proxy.golang.org
        # caches "@main" resolutions for several minutes, which can serve a
        # stale commit right after a fix lands on provider-github's main
        # branch. Fetching directly from GitHub avoids that staleness.
        env:
          GOPROXY: direct
          GOSUMDB: "off"
        run: |
          go install github.com/SemRels/provider-github/cmd/plugin@main
          mv "$(go env GOPATH)/bin/plugin" /tmp/provider-github-plugin

      - name: Configure git identity
        run: |
          git config user.name  "semrel-bot"
          git config user.email "semrel-bot@users.noreply.github.com"

      - name: Run semrel release
        id: semrel
        run: ./semrel-bin release --github-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tag to GitHub
        if: steps.semrel.outputs.released == 'true'
        run: |
          # Push only the tag — no pre-tag commit exists (gobinary plugin removed).
          # Pushing commits to the protected main branch requires admin rights that
          # GITHUB_TOKEN does not have; the tag push is unaffected by branch protection.
          git push --force origin "refs/tags/${{ steps.semrel.outputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save CHANGELOG and clean up before building release assets
        if: steps.semrel.outputs.released == 'true'
        run: |
          # Preserve the updated CHANGELOG.md written by semrel (commit_changelog=false).
          cp CHANGELOG.md /tmp/CHANGELOG_updated.md
          rm -f semrel-bin

      - name: Sync working tree to released tag
        if: steps.semrel.outputs.released == 'true'
        run: |
          # The build step below embeds the tag/version into the binaries via
          # ldflags, so the working tree must point at the exact released commit.
          # The tag is already on HEAD (no pre-tag commit), so this is effectively
          # a clean reset that also discards the uncommitted CHANGELOG.md change.
          git reset --hard "${{ steps.semrel.outputs.tag }}"
          # Restore the updated CHANGELOG so the release archives contain the new content.
          cp /tmp/CHANGELOG_updated.md CHANGELOG.md

      - name: Build cross-platform release binaries
        # Replaces GoReleaser: semrel's own build+archive+checksum step, mirroring
        # the pattern already used by every plugin repo's release.yml. Combined
        # with the provider-github plugin's asset-upload support (added after
        # this workflow was first written), semrel no longer needs an external
        # release tool for its own dogfooded release pipeline.
        if: steps.semrel.outputs.released == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${{ steps.semrel.outputs.version }}"
          commit="${{ github.sha }}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X github.com/SemRels/semrel/internal/version.Version=${version} -X main.commit=${commit} -X main.date=${build_date}"

          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              ext=""
              [ "$goos" = "windows" ] && ext=".exe"
              stage="$(mktemp -d)"
              echo "Building ${goos}/${goarch}..."
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build -trimpath -ldflags="${ldflags}" -o "${stage}/semrel${ext}" ./cmd/semrel
              cp LICENSE README.md CHANGELOG.md "$stage/"
              name="semrel_${version}_${goos}_${goarch}"
              if [ "$goos" = "windows" ]; then
                (cd "$stage" && zip -q -r "${GITHUB_WORKSPACE}/dist/${name}.zip" .)
              else
                tar -C "$stage" -czf "dist/${name}.tar.gz" .
              fi
              rm -rf "$stage"
            done
          done
          ls -la dist

      - name: Generate checksums
        if: steps.semrel.outputs.released == 'true'
        working-directory: dist
        run: sha256sum -- *.tar.gz *.zip > checksums.txt

      - name: Install cosign
        if: steps.semrel.outputs.released == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums with cosign
        # Keyless (OIDC) signing, same scheme previously configured in GoReleaser's
        # `signs:` block. Verify with:
        #   cosign verify-blob --certificate-identity-regexp \
        #     'https://github.com/SemRels/semrel/.github/workflows/semrel-release.yaml.*' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     --certificate checksums.txt.pem --signature checksums.txt.sig checksums.txt
        if: steps.semrel.outputs.released == 'true'
        working-directory: dist
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --new-bundle-format=false \
            --use-signing-config=false \
            --output-signature=checksums.txt.sig \
            --output-certificate=checksums.txt.pem \
            checksums.txt

      - name: Publish GitHub release
        # Invoked directly as a plugin subprocess (not via `semrel release`
        # itself) because the release assets above must exist first, and
        # `semrel release` is what determines/creates the tag and version in
        # the first place. Provider plugins follow a simple env-var contract,
        # so it is safe to run standalone.
        if: steps.semrel.outputs.released == 'true'
        run: /tmp/provider-github-plugin
        env:
          SEMREL_VERSION: ${{ steps.semrel.outputs.version }}
          SEMREL_NEXT_VERSION: ${{ steps.semrel.outputs.tag }}
          SEMREL_TAG_NAME: ${{ steps.semrel.outputs.tag }}
          SEMREL_CHANGELOG: ${{ steps.semrel.outputs.changelog }}
          SEMREL_DRY_RUN: "false"
          SEMREL_PLUGIN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMREL_PLUGIN_OWNER: SemRels
          SEMREL_PLUGIN_REPO: semrel
          SEMREL_PLUGIN_ASSETS: "dist/*.tar.gz,dist/*.zip,dist/checksums.txt,dist/checksums.txt.sig,dist/checksums.txt.pem"

      - name: Summary
        run: |
          if [ "${{ steps.semrel.outputs.released }}" = "true" ]; then
            {
              echo "### Released ${{ steps.semrel.outputs.tag }} 🚀"
              echo "**Bump:** ${{ steps.semrel.outputs.bump }}"
              echo "**Previous:** ${{ steps.semrel.outputs.previous_version }}"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ steps.semrel.outputs.ceiling_applied }}" = "true" ]; then
              echo "> ⚠️ version ceiling applied — bump was clamped" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "### No release — no releasable commits found." >> "$GITHUB_STEP_SUMMARY"
          fi

  docker:
    name: Build and push Docker image
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set version metadata
        id: version
        run: |
          {
            echo "version=${{ needs.release.outputs.tag }}"
            echo "version_short=${{ needs.release.outputs.version_short }}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "vcs_ref=${{ github.sha }}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (distroless)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ghcr.io/semrels/semrel
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest

      - name: Build and push distroless image
        id: build-distroless
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            VCS_REF=${{ steps.version.outputs.vcs_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Sign distroless image with cosign
        run: cosign sign --yes ghcr.io/semrels/semrel@${{ steps.build-distroless.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Build and push alpine image
        id: build-alpine
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          target: alpine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/semrels/semrel:${{ steps.version.outputs.version_short }}-alpine
            ghcr.io/semrels/semrel:latest-alpine
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            VCS_REF=${{ steps.version.outputs.vcs_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Sign alpine image with cosign
        run: cosign sign --yes ghcr.io/semrels/semrel@${{ steps.build-alpine.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/semrels/semrel:${{ steps.version.outputs.version_short }}-alpine
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Docker summary
        run: |
          {
            echo "### Docker image published 🐳"
            echo "**Image:** \`ghcr.io/semrels/semrel:${{ steps.version.outputs.version_short }}\`"
            echo "**Variants:** distroless, alpine"
            echo "**Platforms:** linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
