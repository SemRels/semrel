#
# semrel-release — uses semrel to version semrel itself (dogfooding).
# Flow: push to main → semrel creates tag → GoReleaser publishes release → Docker build+push
#       → CHANGELOG.md committed back to main after GoReleaser
#
# NOTE: All steps are inlined in one workflow because GITHUB_TOKEN-triggered events
# (tag pushes, release creation) cannot trigger other workflows (GitHub Actions security
# restriction). Docker build is a separate job that depends on the release job.
name: Semrel Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialise releases so concurrent pushes do not create conflicting CHANGELOG commits.
# cancel-in-progress: false means later runs queue instead of being cancelled.
concurrency:
  group: semrel-release
  cancel-in-progress: false

permissions:
  contents: write      # push tags and create releases
  packages: write      # push Docker images to ghcr.io
  id-token: write      # cosign OIDC signing
  attestations: write  # SBOM / provenance attestation

jobs:
  release:
    name: Run semrel + GoReleaser
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semrel.outputs.released }}
      tag: ${{ steps.semrel.outputs.tag }}
      version_short: ${{ steps.semrel.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build semrel from source
        run: go build -ldflags="-s -w" -o ./semrel-bin ./cmd/semrel

      - name: Install plugins from source
        # Plugins have no official releases yet — build them from their main branch.
        # Once plugins publish tagged releases this step can switch to:
        #   semrel plugin install condition-github-actions
        # Binaries are placed in ~/.semrel/plugins/ using the discovery name
        # that semrel expects: semrel-plugin-<uses>.
        run: |
          PLUGIN_DIR="$HOME/.semrel/plugins"
          mkdir -p "$PLUGIN_DIR"
          go install github.com/SemRels/condition-github-actions/cmd/plugin@main
          mv "$(go env GOPATH)/bin/plugin" "$PLUGIN_DIR/semrel-plugin-condition-github-actions"
          go install github.com/SemRels/updater-go/cmd/plugin@main
          mv "$(go env GOPATH)/bin/plugin" "$PLUGIN_DIR/semrel-plugin-gobinary"
          echo "Installed plugins:"
          ls -la "$PLUGIN_DIR"

      - name: Configure git identity
        run: |
          git config user.name  "semrel-bot"
          git config user.email "semrel-bot@users.noreply.github.com"

      - name: Run semrel release
        id: semrel
        run: ./semrel-bin release --github-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push pre-tag commit and tag to GitHub
        if: steps.semrel.outputs.released == 'true'
        run: |
          TAG="${{ steps.semrel.outputs.tag }}"
          # Rebase the pre-tag commit onto latest origin/main so the tag points to
          # a commit that is in the main branch. Without this, the CHANGELOG rebase
          # (done later) would create a new SHA for the pre-tag commit, leaving the
          # tag pointing at an orphaned commit not reachable from main.
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main 2>/dev/null; then
            git rebase origin/main
            # Re-tag the rebased commit (rebase creates a new SHA)
            git tag -f "$TAG" HEAD
          fi
          # Push the pre-tag commit to main first (tag must point to a main commit)
          git push origin HEAD:main
          # Push the tag (force in case we re-tagged after rebase)
          git push --force origin "refs/tags/$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save CHANGELOG and clean up before GoReleaser
        if: steps.semrel.outputs.released == 'true'
        run: |
          # Preserve the updated CHANGELOG.md written by semrel (commit_changelog=false).
          cp CHANGELOG.md /tmp/CHANGELOG_updated.md
          # Remove binary and restore CHANGELOG.md so GoReleaser sees a clean git tree.
          # GoReleaser validates that there are no uncommitted changes before building.
          rm -f semrel-bin
          git checkout -- CHANGELOG.md 2>/dev/null || true

      - name: Sync working tree to released tag
        if: steps.semrel.outputs.released == 'true'
        run: |
          # GoReleaser requires the tag to point to the current HEAD.
          # The pre-tag commit was already pushed to origin/main in the previous step,
          # so we just reset to the released tag (which is on a main commit).
          git reset --hard "${{ steps.semrel.outputs.tag }}"

      - name: Run GoReleaser
        if: steps.semrel.outputs.released == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push CHANGELOG.md
        if: steps.semrel.outputs.released == 'true'
        run: |
          TAG="${{ steps.semrel.outputs.tag }}"
          if [ -f /tmp/CHANGELOG_updated.md ]; then
            cp /tmp/CHANGELOG_updated.md CHANGELOG.md
            git add CHANGELOG.md
            if git diff --cached --quiet; then
              echo "No CHANGELOG changes to commit."
            else
              git commit --no-verify -m "chore(changelog): update for $TAG [skip ci]"
              # Rebase on top of latest main to handle any commits pushed since we
              # pushed the pre-tag commit above. The pre-tag commit is already on
              # origin/main so this rebase only replays the CHANGELOG commit itself.
              git pull --rebase -X ours origin main || true
              git push origin HEAD:main
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          if [ "${{ steps.semrel.outputs.released }}" = "true" ]; then
            {
              echo "### Released ${{ steps.semrel.outputs.tag }} 🚀"
              echo "**Bump:** ${{ steps.semrel.outputs.bump }}"
              echo "**Previous:** ${{ steps.semrel.outputs.previous_version }}"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ steps.semrel.outputs.ceiling_applied }}" = "true" ]; then
              echo "> ⚠️ version ceiling applied — bump was clamped" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "### No release — no releasable commits found." >> "$GITHUB_STEP_SUMMARY"
          fi

  docker:
    name: Build and push Docker image
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set version metadata
        id: version
        run: |
          {
            echo "version=${{ needs.release.outputs.tag }}"
            echo "version_short=${{ needs.release.outputs.version_short }}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "vcs_ref=${{ github.sha }}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (distroless)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/semrels/semrel
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest

      - name: Build and push distroless image
        id: build-distroless
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            VCS_REF=${{ steps.version.outputs.vcs_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Sign distroless image with cosign
        run: cosign sign --yes ghcr.io/semrels/semrel@${{ steps.build-distroless.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Build and push alpine image
        id: build-alpine
        uses: docker/build-push-action@v6
        with:
          context: .
          target: alpine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/semrels/semrel:${{ steps.version.outputs.version_short }}-alpine
            ghcr.io/semrels/semrel:latest-alpine
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            VCS_REF=${{ steps.version.outputs.vcs_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Sign alpine image with cosign
        run: cosign sign --yes ghcr.io/semrels/semrel@${{ steps.build-alpine.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/semrels/semrel:${{ steps.version.outputs.version_short }}-alpine
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Docker summary
        run: |
          {
            echo "### Docker image published 🐳"
            echo "**Image:** \`ghcr.io/semrels/semrel:${{ steps.version.outputs.version_short }}\`"
            echo "**Variants:** distroless, alpine"
            echo "**Platforms:** linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
