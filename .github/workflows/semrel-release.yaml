# SPDX-FileCopyrightText: 2026 The semrel Authors
#
# semrel creates the tag, validation images are scanned by digest and promoted,
# then semrel's provider-github plugin publishes signed release assets.
name: Semrel Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Determine release
    runs-on: ubuntu-latest
    concurrency:
      # Only version calculation is serialized. Exact downstream jobs never
      # enter this replaceable pending slot.
      group: semrel-orchestrator-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    outputs:
      build_date: ${{ steps.metadata.outputs.build_date }}
      changelog: ${{ steps.semrel.outputs.changelog }}
      exact_key: ${{ steps.metadata.outputs.exact_key }}
      released: ${{ steps.semrel.outputs.released }}
      image_version: ${{ steps.metadata.outputs.image_version }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      stable: ${{ steps.metadata.outputs.stable }}
      tag: ${{ steps.semrel.outputs.tag }}
      version_short: ${{ steps.semrel.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build semrel from source
        run: go build -ldflags="-s -w" -o "${RUNNER_TEMP}/semrel" ./cmd/semrel

      - name: Install plugins from source
        run: |
          set -euo pipefail
          plugin_dir="${HOME}/.semrel/plugins"
          mkdir -p "${plugin_dir}"
          go install github.com/SemRels/condition-github-actions/cmd/plugin@v0.2.2
          mv "$(go env GOPATH)/bin/plugin" "${plugin_dir}/semrel-plugin-condition-github-actions"
          go install github.com/SemRels/updater-go/cmd/plugin@v0.3.2
          mv "$(go env GOPATH)/bin/plugin" "${plugin_dir}/semrel-plugin-gobinary"

      - name: Configure git identity
        run: |
          git config user.name "semrel-bot"
          git config user.email "semrel-bot@users.noreply.github.com"

      - name: Run semrel release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '"${RUNNER_TEMP}/semrel" release --github-output'

      - name: Capture release source
        id: source
        if: steps.semrel.outputs.released == 'true'
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          source_epoch=$(git show -s --format=%ct HEAD)
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${source_epoch}" =~ ^[0-9]+$ ]]
          {
            printf 'source_sha=%s\n' "${source_sha}"
            printf 'source_epoch=%s\n' "${source_epoch}"
          } >> "${GITHUB_OUTPUT}"

      - name: Push tag to GitHub
        id: tag
        if: steps.semrel.outputs.released == 'true'
        continue-on-error: true
        env:
          TAG: ${{ steps.semrel.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_EPOCH: ${{ steps.source.outputs.source_epoch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${TAG}" == *$'\r'* || "${TAG}" == *$'\n'* ]]; then
            printf 'Tag must not contain CR or LF characters.\n' >&2
            exit 1
          fi
          semver_re='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "${TAG}" =~ ${semver_re} ]] || {
            printf 'semrel returned an invalid SemVer tag: %s\n' "${TAG}" >&2
            exit 1
          }
          normalized="${TAG#v}"
          without_build="${normalized}"
          without_build="${without_build%%+*}"
          if [[ "${without_build}" == *-* ]]; then
            IFS='.' read -r -a identifiers <<< "${without_build#*-}"
            for identifier in "${identifiers[@]}"; do
              [[ ! "${identifier}" =~ ^0[0-9]+$ ]] || exit 1
            done
          fi
          stable=true
          [[ "${without_build}" != *-* ]] || stable=false
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SOURCE_EPOCH}" =~ ^[0-9]+$ ]]
          branch="automation/release-${TAG}"
          # CHANGELOG.md is part of the release commit. Protected main cannot
          # accept that commit directly, so publish it on a PR branch first.
          git switch -c "${branch}"
          git push origin "HEAD:refs/heads/${branch}"
          existing_pr="$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number')"
          if [[ -z "${existing_pr}" ]]; then
            gh pr create --base main --head "${branch}" \
              --title "chore(release): prepare ${TAG}" \
              --body "Automated release preparation for ${TAG}. Merge this PR to bring the generated CHANGELOG.md commit into protected main."
          else
            echo "Release PR #${existing_pr} already exists."
          fi
          {
            printf 'build_date=%s\n' "$(date -u -d "@${SOURCE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
            # Actions concurrency groups are case-insensitive; hash the case-sensitive exact SemVer.
            printf 'exact_key=%s\n' "$(printf '%s' "${normalized}" | sha256sum | cut -d' ' -f1)"
            printf 'image_version=%s\n' "${normalized//+/_}"
            printf 'source_sha=%s\n' "${SOURCE_SHA}"
            printf 'stable=%s\n' "${stable}"
          } >> "${GITHUB_OUTPUT}"
          if ! git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${TAG}"; then
            echo "Git tag push failed; creating the tag through the GitHub REST API."
            response="$(curl --fail-with-body --silent --show-error \
              -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data "{\"ref\":\"refs/tags/${TAG}\",\"sha\":\"${SOURCE_SHA}\"}")" || {
                printf 'Warning: unable to publish tag %s: %s\n' "${TAG}" "${response}" >&2
              }
            printf 'Tag publication response: %s\n' "${response}"
          fi

      - name: Resolve release metadata
        id: metadata
        if: always() && steps.semrel.outputs.released == 'true'
        env:
          TAG: ${{ steps.semrel.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_EPOCH: ${{ steps.source.outputs.source_epoch }}
        run: |
          set -euo pipefail
          [[ "${TAG}" == *$'\r'* || "${TAG}" == *$'\n'* ]] && exit 1
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SOURCE_EPOCH}" =~ ^[0-9]+$ ]]
          normalized="${TAG#v}"
          without_build="${normalized%%+*}"
          stable=true
          [[ "${without_build}" != *-* ]] || stable=false
          {
            printf 'build_date=%s\n' "$(date -u -d "@${SOURCE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
            printf 'exact_key=%s\n' "$(printf '%s' "${normalized}" | sha256sum | cut -d' ' -f1)"
            printf 'image_version=%s\n' "${normalized//+/_}"
            printf 'source_sha=%s\n' "${SOURCE_SHA}"
            printf 'stable=%s\n' "${stable}"
          } >> "${GITHUB_OUTPUT}"

      - name: Preserve generated changelog
        if: steps.semrel.outputs.released == 'true'
        run: cp CHANGELOG.md "${RUNNER_TEMP}/CHANGELOG.md"

      - name: Upload generated changelog
        if: steps.semrel.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-changelog
          path: ${{ runner.temp }}/CHANGELOG.md
          if-no-files-found: error

      - name: Summary
        env:
          BUMP: ${{ steps.semrel.outputs.bump }}
          RELEASED: ${{ steps.semrel.outputs.released }}
          TAG: ${{ steps.semrel.outputs.tag }}
        run: |
          if [[ "${RELEASED}" == "true" ]]; then
            printf '### Prepared %s\n**Bump:** %s\n' "${TAG}" "${BUMP}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### No release — no releasable commits found." >> "${GITHUB_STEP_SUMMARY}"
          fi

  docker-validate:
    name: Validate ${{ matrix.target }} (${{ matrix.platform.arch }})
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [release, alpine, action]
        platform:
          - name: linux/amd64
            arch: amd64
          - name: linux/arm64
            arch: arm64
    steps:
      - name: Check out released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.source_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build immutable OCI validation archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform.name }}
          outputs: type=oci,dest=${{ runner.temp }}/semrel-image-${{ matrix.target }}-${{ matrix.platform.arch }}.tar
          tags: validation:${{ matrix.target }}-${{ matrix.platform.arch }}
          build-args: |
            VERSION=${{ needs.release.outputs.tag }}
            BUILD_DATE=${{ needs.release.outputs.build_date }}
            VCS_REF=${{ needs.release.outputs.source_sha }}
          cache-from: type=gha,scope=validation-${{ matrix.target }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=validation-${{ matrix.target }}-${{ matrix.platform.arch }}
          provenance: true
          sbom: true

      - name: Record validation archive checksum
        shell: bash
        env:
          ARCH: ${{ matrix.platform.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          sha256sum "semrel-image-${TARGET}-${ARCH}.tar" > "semrel-image-${TARGET}-${ARCH}.tar.sha256"

      - name: Extract immutable OCI layout for scanning
        id: extract
        shell: bash
        env:
          ARCH: ${{ matrix.platform.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          scan_dir=$(mktemp -d "${RUNNER_TEMP}/semrel-image-${TARGET}-${ARCH}-layout.XXXXXX")
          tar -xf "${RUNNER_TEMP}/semrel-image-${TARGET}-${ARCH}.tar" -C "${scan_dir}"
          test -f "${scan_dir}/index.json"
          test -f "${scan_dir}/oci-layout"
          printf 'path=%s\n' "${scan_dir}" >> "${GITHUB_OUTPUT}"

      - name: Scan immutable extracted OCI layout
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform.name }}
        with:
          input: ${{ steps.extract.outputs.path }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload scanned OCI validation archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semrel-image-${{ matrix.target }}-${{ matrix.platform.arch }}
          path: |
            ${{ runner.temp }}/semrel-image-${{ matrix.target }}-${{ matrix.platform.arch }}.tar
            ${{ runner.temp }}/semrel-image-${{ matrix.target }}-${{ matrix.platform.arch }}.tar.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  docker:
    name: Publish validated Docker images
    needs: [release, docker-validate]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: exact-image-${{ needs.release.outputs.exact_key }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download scanned OCI validation archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: semrel-image-*
          path: ${{ runner.temp }}/docker-images
          merge-multiple: true

      - name: Set version metadata
        id: version
        shell: bash
        env:
          TAG: ${{ needs.release.outputs.tag }}
          VERSION_SHORT: ${{ needs.release.outputs.version_short }}
        run: |
          set -euo pipefail
          if [[ "${TAG}" == *$'\r'* || "${TAG}" == *$'\n'* ]]; then
            exit 1
          fi
          semver_re='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "${TAG}" =~ ${semver_re} ]] || exit 1
          normalized="${TAG#v}"
          [[ "${normalized}" == "${VERSION_SHORT#v}" ]] || exit 1
          without_build="${normalized%%+*}"
          if [[ "${without_build}" == *-* ]]; then
            IFS='.' read -r -a identifiers <<< "${without_build#*-}"
            for identifier in "${identifiers[@]}"; do
              [[ ! "${identifier}" =~ ^0[0-9]+$ ]] || exit 1
            done
          fi
          stable=true
          if [[ "${without_build}" == *-* ]]; then
            stable=false
          fi
          {
            printf 'version=v%s\n' "${normalized}"
            # SemVer forbids underscores, so replacing '+' is collision-free and Docker-safe.
            printf 'image_version=%s\n' "${normalized//+/_}"
            printf 'stable=%s\n' "${stable}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate final distroless tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/semrels/semrel
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.image_version }}

      - name: Calculate final alpine tags
        id: meta-alpine
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/semrels/semrel
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.image_version }}-alpine

      - name: Calculate final action tags
        id: meta-action
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/semrels/semrel
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.image_version }}-action

      - name: Promote scanned platform images
        id: promote
        shell: bash
        env:
          ARCHIVE_DIR: ${{ runner.temp }}/docker-images
          IMAGE: ghcr.io/semrels/semrel
        run: |
          set -euo pipefail
          cd "${ARCHIVE_DIR}"
          test "$(find . -maxdepth 1 -type f -name 'semrel-image-*.tar' | wc -l)" -eq 6
          test "$(find . -maxdepth 1 -type f -name 'semrel-image-*.tar.sha256' | wc -l)" -eq 6
          sha256sum --check -- semrel-image-*.tar.sha256
          for target in release alpine action; do
            for arch in amd64 arm64; do
              archive="semrel-image-${target}-${arch}.tar"
              source_digest=$(oras resolve --oci-layout "${archive}:${target}-${arch}")
              platform_digest=$(oras resolve --platform "linux/${arch}" --oci-layout "${archive}:${target}-${arch}")
              [[ "${source_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
              [[ "${platform_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
              # Registry deletion is manifest-scoped, so retain this run-scoped tag to protect the final index children.
              staging_tag="scan-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${target}-${arch}"
              oras cp --from-oci-layout "${archive}:${target}-${arch}" "${IMAGE}:${staging_tag}"
              pushed_digest=$(oras resolve "${IMAGE}:${staging_tag}")
              pushed_platform_digest=$(oras resolve --platform "linux/${arch}" "${IMAGE}:${staging_tag}")
              [[ "${pushed_digest}" == "${source_digest}" ]]
              [[ "${pushed_platform_digest}" == "${platform_digest}" ]]
              printf '%s_%s=%s\n' "${target}" "${arch}" "${pushed_digest}" >> "${GITHUB_OUTPUT}"
              printf '%s_%s_image=%s\n' "${target}" "${arch}" "${platform_digest}" >> "${GITHUB_OUTPUT}"
            done
          done

      - name: Create final multiarch manifests from scanned digests
        id: manifests
        shell: bash
        env:
          ACTION_AMD64: ${{ steps.promote.outputs.action_amd64 }}
          ACTION_AMD64_IMAGE: ${{ steps.promote.outputs.action_amd64_image }}
          ACTION_ARM64: ${{ steps.promote.outputs.action_arm64 }}
          ACTION_ARM64_IMAGE: ${{ steps.promote.outputs.action_arm64_image }}
          ACTION_TAGS: ${{ steps.meta-action.outputs.tags }}
          ALPINE_AMD64: ${{ steps.promote.outputs.alpine_amd64 }}
          ALPINE_AMD64_IMAGE: ${{ steps.promote.outputs.alpine_amd64_image }}
          ALPINE_ARM64: ${{ steps.promote.outputs.alpine_arm64 }}
          ALPINE_ARM64_IMAGE: ${{ steps.promote.outputs.alpine_arm64_image }}
          ALPINE_TAGS: ${{ steps.meta-alpine.outputs.tags }}
          DISTROLESS_AMD64: ${{ steps.promote.outputs.release_amd64 }}
          DISTROLESS_AMD64_IMAGE: ${{ steps.promote.outputs.release_amd64_image }}
          DISTROLESS_ARM64: ${{ steps.promote.outputs.release_arm64 }}
          DISTROLESS_ARM64_IMAGE: ${{ steps.promote.outputs.release_arm64_image }}
          DISTROLESS_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ghcr.io/semrels/semrel
        run: |
          set -euo pipefail
          resolve_registry_ref() {
            local ref=$1
            local attempts=4
            local attempt output status
            for ((attempt = 1; attempt <= attempts; attempt++)); do
              if output=$(oras resolve "${ref}" 2>&1); then
                if [[ ! "${output}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  printf 'Registry returned an invalid digest for %s: %s\n' "${ref}" "${output}" >&2
                  return 1
                fi
                printf '%s\n' "${output}"
                return 0
              else
                status=$?
              fi
              if ((attempt < attempts)); then
                sleep "$((attempt * 2))"
              fi
            done
            if grep -Eiq '(^|[^0-9])(401|403|408|409|425|429|5[0-9][0-9])([^0-9]|$)|unauthorized|denied|forbidden|too many requests|timed? out|connection|tls|eof|server error|service unavailable|temporar' <<< "${output}"; then
              printf 'Registry authorization or transient failure resolving %s after %d attempts (exit %d): %s\n' \
                "${ref}" "${attempts}" "${status}" "${output}" >&2
              return 1
            fi
            if grep -Eiq '(^|[^0-9])404([^0-9]|$)|manifest[ _]unknown|name[ _]unknown|(^|[^[:alpha:]])not found([^[:alpha:]]|$)' <<< "${output}"; then
              return 4
            fi
            printf 'Non-definitive registry failure resolving %s after %d attempts (exit %d): %s\n' \
              "${ref}" "${attempts}" "${status}" "${output}" >&2
            return 1
          }
          create_manifest() {
            local output_name=$1
            local tags_text=$2
            local amd64_digest=$3
            local arm64_digest=$4
            local amd64_image_digest=$5
            local arm64_image_digest=$6
            local candidate_tag digest exact_tag existing_digest
            local -a final_tags
            [[ "${amd64_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "${arm64_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "${amd64_image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "${arm64_image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            mapfile -t final_tags < <(printf '%s\n' "${tags_text}" | sed '/^[[:space:]]*$/d')
            ((${#final_tags[@]} == 1))
            exact_tag="${final_tags[0]}"
            [[ "${exact_tag}" == "${IMAGE}:"* ]]
            [[ "${output_name}" =~ ^(distroless|alpine|action)$ ]]
            candidate_tag="${IMAGE}:manifest-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${output_name}"
            docker buildx imagetools create \
              --tag "${candidate_tag}" \
              "${IMAGE}@${amd64_digest}" \
              "${IMAGE}@${arm64_digest}"
            if ! digest=$(resolve_registry_ref "${candidate_tag}"); then
              printf 'Candidate manifest %s could not be resolved; refusing publication.\n' "${candidate_tag}" >&2
              return 1
            fi
            if existing_digest=$(resolve_registry_ref "${exact_tag}"); then
              if [[ "${existing_digest}" != "${digest}" ]]; then
                if ! docker buildx imagetools inspect --raw "${exact_tag}" |
                  jq -e \
                    --arg amd64 "${amd64_image_digest}" \
                    --arg arm64 "${arm64_image_digest}" \
                    'any(.manifests[]; .digest == $amd64 and .platform.os == "linux" and .platform.architecture == "amd64") and
                     any(.manifests[]; .digest == $arm64 and .platform.os == "linux" and .platform.architecture == "arm64")' \
                    >/dev/null; then
                  printf 'Refusing to mutate immutable exact tag %s (%s != %s).\n' \
                    "${exact_tag}" "${existing_digest}" "${digest}" >&2
                  return 1
                fi
                digest="${existing_digest}"
              fi
            else
              resolve_status=$?
              if ((resolve_status != 4)); then
                return "${resolve_status}"
              fi
              oras tag "${IMAGE}@${digest}" "${exact_tag#"${IMAGE}:"}"
            fi
            if ! published_digest=$(resolve_registry_ref "${exact_tag}"); then
              printf 'Exact tag %s could not be verified after publication.\n' "${exact_tag}" >&2
              return 1
            fi
            if [[ "${published_digest}" != "${digest}" ]]; then
              printf 'Refusing exact-tag conflict for %s (%s != %s).\n' \
                "${exact_tag}" "${published_digest}" "${digest}" >&2
              return 1
            fi
            docker buildx imagetools inspect --raw "${exact_tag}" |
              jq -e \
                --arg amd64 "${amd64_image_digest}" \
                --arg arm64 "${arm64_image_digest}" \
                'any(.manifests[]; .digest == $amd64 and .platform.os == "linux" and .platform.architecture == "amd64") and
                 any(.manifests[]; .digest == $arm64 and .platform.os == "linux" and .platform.architecture == "arm64")' \
                >/dev/null
            printf '%s=%s\n' "${output_name}" "${digest}" >> "${GITHUB_OUTPUT}"
          }
          create_manifest distroless "${DISTROLESS_TAGS}" "${DISTROLESS_AMD64}" "${DISTROLESS_ARM64}" "${DISTROLESS_AMD64_IMAGE}" "${DISTROLESS_ARM64_IMAGE}"
          create_manifest alpine "${ALPINE_TAGS}" "${ALPINE_AMD64}" "${ALPINE_ARM64}" "${ALPINE_AMD64_IMAGE}" "${ALPINE_ARM64_IMAGE}"
          create_manifest action "${ACTION_TAGS}" "${ACTION_AMD64}" "${ACTION_ARM64}" "${ACTION_AMD64_IMAGE}" "${ACTION_ARM64_IMAGE}"

      - name: Sign published image digests
        shell: bash
        env:
          ACTION_DIGEST: ${{ steps.manifests.outputs.action }}
          ALPINE_DIGEST: ${{ steps.manifests.outputs.alpine }}
          COSIGN_EXPERIMENTAL: '1'
          DISTROLESS_DIGEST: ${{ steps.manifests.outputs.distroless }}
        run: |
          set -euo pipefail
          for digest in "${DISTROLESS_DIGEST}" "${ALPINE_DIGEST}" "${ACTION_DIGEST}"; do
            cosign sign --yes "ghcr.io/semrels/semrel@${digest}"
          done

      - name: Docker publication summary
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "### Docker images published ✅" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::Docker publication failed; no immutable GHCR exact tag was overwritten."
            {
              echo "### Docker publication failed ⚠️"
              echo "The GitHub release job is allowed to continue. Any pre-existing immutable exact tag was preserved."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

  publish:
    name: Publish GitHub release
    needs: [release, docker]
    # Docker publication is deliberately independent of release assets: an
    # immutable exact-tag conflict must leave Docker failed without blocking
    # the validated Go artifacts or GitHub release.
    if: >-
      always() &&
      needs.release.outputs.released == 'true' &&
      (needs.docker.result == 'success' || needs.docker.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.source_sha }}

      - name: Restore generated changelog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-changelog
          path: .

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release metadata
        env:
          RELEASE_BUILD_DATE: ${{ needs.release.outputs.build_date }}
          RELEASE_SOURCE_SHA: ${{ needs.release.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.release.outputs.version_short }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "${RELEASE_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RELEASE_BUILD_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]

      - name: Build cross-platform release archives
        env:
          BUILD_DATE: ${{ needs.release.outputs.build_date }}
          SOURCE_SHA: ${{ needs.release.outputs.source_sha }}
          VERSION: ${{ needs.release.outputs.version_short }}
        run: |
          set -euo pipefail
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "${VERSION}" =~ ${semver_re} ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${BUILD_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]

          mkdir -p dist
          stage_root="${RUNNER_TEMP}/release-assets"
          rm -rf "${stage_root}"
          mkdir -p "${stage_root}"
          ldflags="-s -w -X github.com/SemRels/semrel/internal/version.Version=${VERSION}"

          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              ext=""
              [[ "${goos}" != windows ]] || ext=".exe"
              stage="${stage_root}/${goos}_${goarch}"
              mkdir -p "${stage}"
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
                go build -trimpath -ldflags="${ldflags}" -o "${stage}/semrel${ext}" ./cmd/semrel
              cp LICENSE README.md CHANGELOG.md "${stage}/"
              name="semrel_${VERSION}_${goos}_${goarch}"
              if [[ "${goos}" == windows ]]; then
                (cd "${stage}" && zip -q -r "${GITHUB_WORKSPACE}/dist/${name}.zip" .)
              else
                tar -C "${stage}" -czf "dist/${name}.tar.gz" .
              fi
            done
          done

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.zip > checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums with cosign
        working-directory: dist
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --bundle=checksums.txt.bundle \
            checksums.txt

      - name: Add release footer
        env:
          CHANGELOG: ${{ needs.release.outputs.changelog }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          delimiter="SEMREL_CHANGELOG_${GITHUB_RUN_ID}"
          {
            printf 'SEMREL_CHANGELOG<<%s\n' "${delimiter}"
            printf '%s\n' "${CHANGELOG}"
            if [[ -n "${previous_tag}" ]]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "${GITHUB_REPOSITORY}" "${previous_tag}" "${TAG}"
            fi
            printf '%s\n' "${delimiter}"
          } >> "${GITHUB_ENV}"

      - name: Build provider-github plugin
        # Pinned to the release-asset Content-Length fix.
        env:
          GOPROXY: direct
          GOSUMDB: "off"
        run: |
          set -euo pipefail
          go install github.com/SemRels/provider-github/cmd/plugin@3c974fff4ad24d8c4dc45b169d2727607472ab08
          mv "$(go env GOPATH)/bin/plugin" "${RUNNER_TEMP}/provider-github-plugin"

      - name: Publish GitHub release
        env:
          PROVIDER_BIN: ${{ runner.temp }}/provider-github-plugin
          SEMREL_DRY_RUN: "false"
          SEMREL_NEXT_VERSION: ${{ needs.release.outputs.tag }}
          SEMREL_PLUGIN_ASSETS: "dist/*.tar.gz,dist/*.zip,dist/checksums.txt,dist/checksums.txt.bundle"
          SEMREL_PLUGIN_OWNER: SemRels
          SEMREL_PLUGIN_REPO: semrel
          SEMREL_PLUGIN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMREL_TAG_NAME: ${{ needs.release.outputs.tag }}
          SEMREL_VERSION: ${{ needs.release.outputs.version_short }}
        run: '"${PROVIDER_BIN}"'

      - name: Release summary
        if: always()
        env:
          DOCKER_RESULT: ${{ needs.docker.result }}
          JOB_STATUS: ${{ job.status }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION_SHORT: ${{ needs.release.outputs.version_short }}
        run: |
          {
            if [[ "${JOB_STATUS}" != "success" ]]; then
              printf '### GitHub release publication failed for %s ❌\n' "${TAG}"
            elif [[ "${DOCKER_RESULT}" == "success" ]]; then
              printf '### Released %s 🚀\n' "${TAG}"
              printf '%s\n' "**Docker image:** \`ghcr.io/semrels/semrel:${VERSION_SHORT//+/_}\`"
              echo "**Variants:** distroless, alpine, GitHub Actions"
            else
              printf '### Released %s 🚀 (Docker publication failed)\n' "${TAG}"
              echo "::warning::Docker publication failed; the immutable GHCR exact tag was not overwritten. The GitHub release and Go artifacts were published."
              echo "**Docker:** ⚠️ failed (immutable exact-tag conflict or another publication error; no conflicting tag was overwritten)"
              echo "**Go artifacts:** ✅ published"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  reconcile:
    name: Reconcile mutable image tags
    needs: [release, docker, publish]
    if: >-
      needs.release.outputs.released == 'true' &&
      needs.release.outputs.stable == 'true' &&
      needs.docker.result == 'success' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: mutable-image-tags
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select globally greatest published stable versions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/semrels/semrel
        run: |
          set -euo pipefail
          release_tags="${RUNNER_TEMP}/published-release-tags.txt"
          resolved_images="${RUNNER_TEMP}/resolved-exact-images.tsv"
          desired="${RUNNER_TEMP}/desired-mutable-tags.tsv"
          gh api --paginate --jq \
            '.[] | select(.draft == false and .published_at != null) | .tag_name' \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "${release_tags}"
          : > "${resolved_images}"
          resolve_registry_ref() {
            local ref=$1
            local attempts=4
            local attempt output status
            for ((attempt = 1; attempt <= attempts; attempt++)); do
              if output=$(oras resolve "${ref}" 2>&1); then
                if [[ ! "${output}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  printf 'Registry returned an invalid digest for %s: %s\n' "${ref}" "${output}" >&2
                  return 1
                fi
                printf '%s\n' "${output}"
                return 0
              else
                status=$?
              fi
              if ((attempt < attempts)); then
                sleep "$((attempt * 2))"
              fi
            done
            if grep -Eiq '(^|[^0-9])(401|403|408|409|425|429|5[0-9][0-9])([^0-9]|$)|unauthorized|denied|forbidden|too many requests|timed? out|connection|tls|eof|server error|service unavailable|temporar' <<< "${output}"; then
              printf 'Registry authorization or transient failure resolving %s after %d attempts (exit %d): %s\n' \
                "${ref}" "${attempts}" "${status}" "${output}" >&2
              return 1
            fi
            if grep -Eiq '(^|[^0-9])404([^0-9]|$)|manifest[ _]unknown|name[ _]unknown|(^|[^[:alpha:]])not found([^[:alpha:]]|$)' <<< "${output}"; then
              return 4
            fi
            printf 'Non-definitive registry failure resolving %s after %d attempts (exit %d): %s\n' \
              "${ref}" "${attempts}" "${status}" "${output}" >&2
            return 1
          }
          semver_re='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          while IFS= read -r published_tag; do
            [[ "${published_tag}" != *$'\r'* && "${published_tag}" != *$'\n'* ]] || continue
            [[ "${published_tag}" =~ ${semver_re} ]] || continue
            normalized="${published_tag#v}"
            without_build="${normalized%%+*}"
            [[ "${without_build}" != *-* ]] || continue
            exact="${normalized//+/_}"
            available=true
            digests=()
            for suffix in '' -alpine -action; do
              if digest=$(resolve_registry_ref "${IMAGE}:${exact}${suffix}"); then
                digests+=("${digest}")
              else
                resolve_status=$?
                if ((resolve_status == 4)); then
                  available=false
                  break
                fi
                printf 'Aborting reconcile before alias mutation because %s:%s%s was not definitively absent.\n' \
                  "${IMAGE}" "${exact}" "${suffix}" >&2
                exit "${resolve_status}"
              fi
            done
            if [[ "${available}" == "true" ]]; then
              ((${#digests[@]} == 3))
              printf '%s\t%s\t%s\t%s\n' \
                "${exact}" "${digests[0]}" "${digests[1]}" "${digests[2]}" >> "${resolved_images}"
            fi
          done < "${release_tags}"
          python3 - "${release_tags}" "${resolved_images}" "${desired}" <<'PY'
          import re
          import sys
          from collections import defaultdict

          release_path, resolved_path, output_path = sys.argv[1:]
          semver = re.compile(
              r"^v?(?P<major>0|[1-9][0-9]*)\."
              r"(?P<minor>0|[1-9][0-9]*)\."
              r"(?P<patch>0|[1-9][0-9]*)"
              r"(?:-(?P<pre>[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?"
              r"(?:\+(?P<build>[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$"
          )
          image_digests = {}
          for raw in open(resolved_path, encoding="utf-8"):
              exact, base, alpine, action = raw.rstrip("\n").split("\t")
              if not all(re.fullmatch(r"sha256:[0-9a-f]{64}", digest)
                         for digest in (base, alpine, action)):
                  raise SystemExit(f"invalid resolved digest for {exact}")
              image_digests[exact] = (base, alpine, action)
          candidates = {}
          for raw in open(release_path, encoding="utf-8"):
              raw = raw.rstrip("\n")
              match = semver.fullmatch(raw)
              if not match:
                  continue
              prerelease = match.group("pre")
              if prerelease:
                  if any(part.isdigit() and len(part) > 1 and part[0] == "0"
                         for part in prerelease.split(".")):
                      continue
                  continue
              normalized = raw[1:] if raw.startswith("v") else raw
              exact = normalized.replace("+", "_")
              if exact not in image_digests:
                  continue
              candidates[normalized] = (
                  int(match.group("major")),
                  int(match.group("minor")),
                  int(match.group("patch")),
                  normalized,
                  exact,
                  *image_digests[exact],
              )

          if not candidates:
              raise SystemExit("no published stable SemVer release has all exact image variants")

          # Build metadata is absent from the precedence tuple. The normalized
          # full version is the stable ASCII tie-break for equal precedence.
          def winner(values):
              return max(values, key=lambda item: (item[0], item[1], item[2], item[3]))

          values = list(candidates.values())
          by_major = defaultdict(list)
          by_minor = defaultdict(list)
          for item in values:
              by_major[item[0]].append(item)
              by_minor[(item[0], item[1])].append(item)

          desired = [("latest", winner(values))]
          desired.extend(
              (str(major), winner(group))
              for major, group in sorted(by_major.items())
          )
          desired.extend(
              (f"{major}.{minor}", winner(group))
              for (major, minor), group in sorted(by_minor.items())
          )
          with open(output_path, "w", encoding="utf-8", newline="\n") as output:
              for alias, item in desired:
                  output.write(
                      f"{alias}\t{item[4]}\t{item[3]}\t"
                      f"{item[5]}\t{item[6]}\t{item[7]}\n"
                  )
          PY
          test -s "${desired}"

      - name: Point mutable tags at selected immutable digests
        shell: bash
        env:
          IMAGE: ghcr.io/semrels/semrel
        run: |
          set -euo pipefail
          resolve_registry_ref() {
            local ref=$1
            local attempts=4
            local attempt output status
            for ((attempt = 1; attempt <= attempts; attempt++)); do
              if output=$(oras resolve "${ref}" 2>&1); then
                if [[ ! "${output}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  printf 'Registry returned an invalid digest for %s: %s\n' "${ref}" "${output}" >&2
                  return 1
                fi
                printf '%s\n' "${output}"
                return 0
              else
                status=$?
              fi
              if ((attempt < attempts)); then
                sleep "$((attempt * 2))"
              fi
            done
            printf 'Unable to verify mutable tag %s after %d attempts (exit %d): %s\n' \
              "${ref}" "${attempts}" "${status}" "${output}" >&2
            return 1
          }
          desired="${RUNNER_TEMP}/desired-mutable-tags.tsv"
          while IFS=$'\t' read -r alias exact version digest alpine_digest action_digest; do
            [[ "${alias}" == "latest" || "${alias}" =~ ^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$ ]]
            [[ "${exact}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(_[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "${alpine_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "${action_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            oras tag "${IMAGE}@${digest}" "${alias}"
            if ! alias_digest=$(resolve_registry_ref "${IMAGE}:${alias}"); then
              exit 1
            fi
            [[ "${alias_digest}" == "${digest}" ]]
            if [[ "${alias}" == "latest" ]]; then
              oras tag "${IMAGE}@${alpine_digest}" latest-alpine
              oras tag "${IMAGE}@${action_digest}" latest-action
              [[ "$(resolve_registry_ref "${IMAGE}:latest-alpine")" == "${alpine_digest}" ]]
              [[ "$(resolve_registry_ref "${IMAGE}:latest-action")" == "${action_digest}" ]]
            fi
            printf '%s -> %s (%s)\n' "${alias}" "${exact}" "${version}" >> "${GITHUB_STEP_SUMMARY}"
          done < "${desired}"
