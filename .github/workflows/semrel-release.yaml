#
# semrel-release — uses semrel to version semrel itself (dogfooding).
# Flow: push to main → semrel creates tag → GoReleaser publishes release → docker.yml triggers
#
# NOTE: The GoReleaser step is inlined here (not in release.yaml) because GITHUB_TOKEN
# tag pushes do not trigger other workflows (GitHub Actions security restriction).
# GoReleaser creates the GitHub Release via API, which DOES trigger docker.yml via
# the `release: published` event.
name: Semrel Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed to push tags and create releases
  packages: write  # needed for GoReleaser
  id-token: write  # needed for GoReleaser cosign

jobs:
  release:
    name: Run semrel
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build semrel from source
        run: |
          go build -ldflags="-s -w" -o ./semrel-bin ./cmd/semrel

      - name: Configure git identity
        run: |
          git config user.name  "semrel-bot"
          git config user.email "semrel-bot@users.noreply.github.com"

      - name: Run semrel release
        id: semrel
        run: ./semrel-bin release --github-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tag to GitHub
        if: steps.semrel.outputs.released == 'true'
        run: |
          TAG="${{ steps.semrel.outputs.tag }}"
          # Check if tag already exists on remote (e.g. during bootstrap or re-runs)
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on remote — skipping push (idempotent)."
          else
            git push origin "refs/tags/$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        if: steps.semrel.outputs.released == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          if [ "${{ steps.semrel.outputs.released }}" = "true" ]; then
            echo "### Released ${{ steps.semrel.outputs.tag }} 🚀" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Bump:** ${{ steps.semrel.outputs.bump }}" >> $GITHUB_STEP_SUMMARY
            echo "**Previous:** ${{ steps.semrel.outputs.previous_version }}" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.semrel.outputs.ceiling_applied }}" = "true" ]; then
              echo "> ⚠️ version ceiling applied — bump was clamped" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### No release — no releasable commits found." >> $GITHUB_STEP_SUMMARY
          fi
