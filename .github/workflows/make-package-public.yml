#
# One-shot workflow: sets the ghcr.io/semrels/semrel package to public.
# Requires the PACKAGES_TOKEN org secret (PAT with write:packages scope).
# Run once via workflow_dispatch; afterwards semrel-release.yml handles it on every build.
name: Make container package public

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  set-public:
    name: Set GHCR package visibility to public
    runs-on: ubuntu-latest
    steps:
      - name: Set semrel container package to public
        run: |
          gh api -X PATCH /orgs/semrels/packages/container/semrel \
            -f visibility=public
          echo "✓ ghcr.io/semrels/semrel is now public"
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
