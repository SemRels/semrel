# CI — build, test and lint on every push to main and on PRs
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.go == '1.27.0-rc.1' }}
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", "1.26", "1.27.0-rc.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go }}
          allow-prereleases: true
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Test shared integration harness
        if: matrix.go == '1.26'
        run: go test -tags=integration ./pkg/sdk/sdktest/...

      - name: Show coverage summary
        run: go tool cover -func=coverage.txt | tail -1

      - name: Upload coverage report
        if: matrix.go == '1.26'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.txt
          retention-days: 30
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  docker-action:
    name: Docker action ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test GitHub Actions workspace ownership
        run: bash .github/scripts/test-docker-action.sh
